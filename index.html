<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAWORLD | الرئيسية</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="toolbar.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="context_menu.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // تطبيق الثيم المحفوظ فوراً لمنع الوميض الأبيض
    (function() {
      const data = localStorage.getItem('novel_reader_v9');
      if (data) {
        try {
          const settings = JSON.parse(data).settings;
          if (settings && settings.theme) {
            document.documentElement.classList.add(settings.theme);
            document.body.classList.add(settings.theme);
          }
        } catch (e) {}
      }
    })();
  </script>
</head>
<body>

  <div id="mainToolbar" class="sticky-bar"></div>

  <div id="homeApp">
    <!-- المحتوى سيتم توليده ديناميكياً بواسطة HomeEngine -->
  </div>

  <!-- Main Application Entry Point -->
  <script type="module" src="app_layout.js"></script>

</body>
</html>
