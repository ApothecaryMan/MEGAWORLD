<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAWORLD Novel Editor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="toolbar.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="tabs.css">
  <link rel="stylesheet" href="context_menu.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<!-- زر إلغاء التركيز -->
<button class="focus-exit" onclick="document.body.classList.remove('focus-mode')">إلغاء وضع التركيز</button>

<!-- القائمة العلوية المكوناتية -->
<div class="sticky-bar" id="mainToolbar">
  <!-- يتم بناؤها ديناميكياً بواسطة Toolbar Engine -->
</div>

<div class="main-layout">
  <!-- القائمة الجانبية -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">
        <span>المكتبة</span>
        <button class="btn-icon" onclick="addNovel()" title="رواية جديدة">+</button>
      </div>
      <div class="side-list" id="libraryList"></div>
    </div>

    <div class="sidebar-sep"></div>

    <div class="sidebar-section">
      <div class="sidebar-title">
        <span>قائمة الفصول</span>
        <button class="btn-icon" onclick="addChapter()" title="إضافة فصل">+</button>
      </div>

      <!-- فلتر الدروب صممناه -->
      <div class="dropdown-wrap" id="chaptersFilter">
        <div class="dropdown-trigger" onclick="this.parentElement.classList.toggle('open')">
          <span id="filterLabel">الأقدم أولاً</span>
          <i class="ti ti-chevron-down"></i>
        </div>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="sortChapters('asc')">الأقدم أولاً <i class="ti ti-arrow-up"></i></button>
          <button class="dropdown-item" onclick="sortChapters('desc')">الأحدث أولاً <i class="ti ti-arrow-down"></i></button>
        </div>
      </div>

      <div class="side-list" id="sideList"></div>
    </div>
  </div>

  <div class="body-area" style="flex:1; min-width:0;">
    <!-- شريط التبويبات -->
    <div class="tabs-bar" id="tabsBar"></div>
    
    <!-- منطقة المحتوى -->
    <div class="body-wrap" id="bodyWrap"></div>
  </div>

  <!-- لوحة بيانات الرواية المنفصلة (الجهة اليسرى) -->
  <div class="sidebar sidebar-left" id="novelDataPanel">
    <div class="sidebar-section">
      <div class="sidebar-title">
        <span>بيانات الرواية</span>
        <div class="flex-row">
          <button class="btn-icon" id="saveNovelBtn" onclick="saveNovelDetails()" title="حفظ"><i class="ti ti-device-floppy"></i></button>
          <button class="btn-icon" onclick="toggleNovelDataPanel(false)" title="إغلاق"><i class="ti ti-x"></i></button>
        </div>
      </div>
      <div class="side-list" id="novelDataList" style="padding: 10px; display: flex; flex-direction: column; gap: 12px;">
        <!-- يتم ملؤها ديناميكياً بواسطة sidebar.js -->
      </div>
    </div>
  </div>
</div>

<!-- Core Scripts -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module" src="app_layout.js"></script>

<!-- Hidden File Input for Covers -->
<input type="file" id="coverPicker" accept="image/*" style="display:none">

</body>
</html>
