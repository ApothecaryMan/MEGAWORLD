<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAWORLD Novel Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="toolbar.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="context_menu.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="root bg-def" id="root">

  <!-- القائمة العلوية -->
  <div class="sticky-bar">
    <button class="btn" title="الرئيسية">الرئيسية</button>
    <button class="btn" onclick="toggleSidebar()" id="sideToggleBtn">القائمة</button>
    <span class="lbl">الدليل</span>
    <div class="stats-box">
      <div class="stat"><b id="wc">0</b>&nbsp;كلمة</div>
      <div class="stats-divider"></div>
      <div class="stat"><b id="cc">0</b>&nbsp;حرف</div>
      <div class="stats-divider"></div>
      <div class="stat"><b id="rt">0</b>&nbsp;<span id="rt-lbl">دقيقة</span></div>
    </div>
    <span class="lbl">خط</span>
    <button class="btn" id="f1" onclick="setFont('fn','f1')">أميـري</button>
    <button class="btn" id="f2" onclick="setFont('fn2','f2')">نـسخ</button>
    <button class="btn" id="f3" onclick="setFont('fn3','f3')">نـظام</button>
    <div class="sep"></div>
    <span class="lbl">الحجم</span>
    <button class="btn" onclick="chSz(-2)">−</button>
    <span class="lbl" id="szlbl" style="min-width:22px;text-align:center;">22</span>
    <button class="btn" onclick="chSz(2)">+</button>
    <div class="sep"></div>
    <span class="lbl">محاذاة</span>
    <button class="btn" id="ar" onclick="setAl('ar','ar')" aria-label="يمين">يمين</button>
    <button class="btn" id="ac" onclick="setAl('ac','ac')" aria-label="وسط">وسط</button>
    <button class="btn" id="aj" onclick="setAl('aj','aj')" aria-label="ضبط">ضبط</button>
    <div class="sep"></div>
    <button class="btn" id="contBtn" onclick="toggleContinuousMode()">متواصل</button>

    <span class="lbl">خلفية</span>
    <div class="swatch-wrap" id="swatches"></div>
    
    <input type="text" class="search-input" id="sq" placeholder="بحث عن..." oninput="doSearch(this.value)">

    <button class="btn" onclick="toggleFocus()">تركيز</button>
    <button class="btn" onclick="exportTxt()">تصدير</button>

    <div class="spacer"></div>
    <button class="btn" onclick="openModal()" id="editBtn">تعديل</button>
    <button class="btn" onclick="deleteChapter()">حذف</button>
    
    <div class="site-name">
      <input type="text" id="novelTitleInput" class="novel-title-field" placeholder="اسم الرواية..." oninput="updateNovelTitle(this.value)">
    </div>
  </div>

  <div class="main-layout">
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>المكتبة</span>
          <button class="tab-add" onclick="addNovel()" title="رواية جديدة">+</button>
        </div>
        <div class="side-list" id="libraryList"></div>
      </div>

      <div class="sidebar-sep"></div>

      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>قائمة الفصول</span>
          <button class="tab-add" onclick="addChapter()" title="إضافة فصل">+</button>
        </div>
        <div class="side-list" id="sideList"></div>
      </div>
    </div>

    <div class="body-area" style="flex:1; min-width:0;">
      <!-- شريط التبويبات -->
      <div class="tabs-bar" id="tabsBar">
        <button class="tab-add" onclick="addChapter()" title="فصل جديد">+</button>
      </div>
      <div class="body-wrap" id="bodyWrap"></div>
    </div>
  </div>

</div>

<!-- القائمة المنيو (المنبثقة) -->
<div class="context-menu" id="contextMenu">
  <div class="context-title">القائمة السريعة</div>
  <button class="context-item" onclick="openModal()">
    <span>تعديل الفصل</span>
    <small>Ctrl + E</small>
  </button>
  <button class="context-item" onclick="addChapter()">
    <span>فصل جديد</span>
    <small>+</small>
  </button>
  <button class="context-item" onclick="deleteChapter()">
    <span>حذف الفصل</span>
    <small>Del</small>
  </button>
  <div class="context-sep"></div>
  <button class="context-item" onclick="goTo(activeIdx-1)"><span>الفصل السابق</span></button>
  <button class="context-item" onclick="goTo(activeIdx+1)"><span>الفصل التالي</span></button>
  <div class="context-sep"></div>
  <button class="context-item" onclick="searchInChapter()">
    <span>بحث داخل الفصل</span>
    <small>Ctrl + F</small>
  </button>
  <button class="context-item" onclick="exportTxt()"><span>تصدير TXT</span></button>
  <div class="context-sep"></div>
  <button class="context-item" onclick="setThemeQuick('bg-def')"><span>الثيم الافتراضي</span></button>
  <button class="context-item" onclick="setThemeQuick('bg-night')"><span>الثيم الليلي</span></button>
  <button class="context-item" onclick="setThemeQuick('bg-ivory')"><span>الثيم الورقي</span></button>
  <div class="context-sep"></div>
  <button class="context-item" onclick="toggleFocus()"><span>وضع التركيز</span></button>
</div>

<!-- المحرر (Modal) -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <span class="modal-title">اسم الفصل:</span>
      <input class="modal-title-input" id="titleInput" placeholder="الفصل الأول...">
    </div>
    <textarea class="ta" id="ta" placeholder="الصق نص الفصل هنا..."></textarea>
    <div class="modal-btns">
      <button class="btn" onclick="applyText()">حفظ</button>
      <button class="btn" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<button class="focus-exit" onclick="toggleFocus()">إغلاق وضع التركيز</button>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

<!-- استيراد الموديولات بالترتيب الصحيح -->
<script src="config.js"></script>
<script src="storage.js"></script>
<script src="reader.js"></script>
<script src="toolbar.js"></script>
<script src="sidebar.js"></script>
<script src="context_menu.js"></script>
<script src="editor.js"></script>

</body>
</html>
