<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGAWORLD Novel Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="toolbar.css">
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="context_menu.css">
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="root bg-def" id="root">
  <!-- زر إلغاء التركيز -->
  <button class="focus-exit" onclick="document.body.classList.remove('focus-mode')">إلغاء وضع التركيز</button>

  <!-- القائمة العلوية المكوناتية -->
  <div class="sticky-bar" id="mainToolbar">
    <!-- يتم بناؤها ديناميكياً بواسطة Toolbar Engine -->
  </div>

  <div class="main-layout">
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>المكتبة</span>
          <button class="btn-icon" onclick="addNovel()" title="رواية جديدة">+</button>
        </div>
        <div class="side-list" id="libraryList"></div>
      </div>

      <div class="sidebar-sep"></div>

      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>قائمة الفصول</span>
          <button class="btn-icon" onclick="addChapter()" title="إضافة فصل">+</button>
        </div>
        <div class="side-list" id="sideList"></div>
      </div>
    </div>

    <div class="body-area" style="flex:1; min-width:0;">
      <!-- شريط التبويبات -->
      <div class="tabs-bar" id="tabsBar"></div>
      
      <!-- منطقة المحتوى -->
      <div class="body-wrap" id="bodyWrap"></div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- القائمة المنبثقة الذكية -->
  <div class="context-menu" id="contextMenu"></div>

  <!-- النافذة المنبثقة للمحرر -->
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modal">
      <div class="modal-hdr">
        <div class="modal-title">اسم الفصل:</div>
        <input class="input-flat" style="flex:1; border:none; border-bottom:1px solid var(--ui-border-light);" id="titleInput" placeholder="الفصل الأول...">
      </div>
      <textarea class="ta" id="ta" placeholder="الصق نص الفصل هنا..."></textarea>
      <div class="modal-btns">
        <button class="btn-flat" onclick="closeModal()">إلغاء</button>
        <button class="btn-flat active" onclick="applyText()">حفظ</button>
      </div>
    </div>
  </div>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="store.js"></script>
<script src="toolbar.js"></script>
<script src="sidebar.js"></script>
<script src="context_menu.js"></script>
<script src="quote.js"></script>
<script src="editor.js"></script>
<script src="editor.js"></script>
<script src="reader.js"></script>

</body>
</html>
