<!DOCTYPE html>
<html lang="ar" dir="rtl">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cinzel+Decorative:wght@700&display=swap');
  
  :root {
    --color-background-primary: #f5f3f0;
    --color-text-primary: #2d2d2d;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    font-family:var(--font-sans);
    transition:background .25s,color .25s;
    background: var(--color-background-primary);
    color: var(--color-text-primary);
    overflow-x: hidden;
  }

  .root.bg-def  {background:var(--color-background-primary);color:var(--color-text-primary);}
  .root.bg-ivory{background:#fdf6e3;color:#3b3020;}
  .root.bg-pink {background:#fdf0f0;color:#3a1e1e;}
  .root.bg-mint {background:#f0fdf5;color:#1a3326;}
  .root.bg-sky  {background:#eff6ff;color:#1e2f4a;}
  .root.bg-gray {background:#f4f4f2;color:#2a2a2a;}
  .root.bg-night{background:#1a1a2e;color:#e0d8c8;}
  .root.bg-dark {background:#212121;color:#d4c9b0;}

  .sticky-bar{
    position:sticky;top:0;z-index:20;
    display:flex;flex-wrap:nowrap;align-items:center;gap:8px;
    padding:8px 16px;
    border-bottom:1px solid rgba(128,128,128,0.15);
    background:inherit;
    overflow-x:auto;scrollbar-width:none;
    transition:background .25s;
  }
  .sticky-bar::-webkit-scrollbar{display:none;}
  .root.bg-def   .sticky-bar{background:var(--color-background-primary);}
  .root.bg-ivory .sticky-bar{background:#fdf6e3;}
  .root.bg-pink  .sticky-bar{background:#fdf0f0;}
  .root.bg-mint  .sticky-bar{background:#f0fdf5;}
  .root.bg-sky   .sticky-bar{background:#eff6ff;}
  .root.bg-gray  .sticky-bar{background:#f4f4f2;}
  .root.bg-night .sticky-bar{background:#1a1a2e;}
  .root.bg-dark  .sticky-bar{background:#212121;}

  .sep{display:none;}
  .spacer{flex:1;min-width:4px;}

  .btn{
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 10px;font-family:var(--font-sans);font-size:12px;
    color:inherit;background:transparent;
    border:1px solid rgba(128,128,128,0.35);border-radius:0;
    cursor:pointer;white-space:nowrap;height:28px;line-height:1;flex-shrink:0;
    transition:background .12s;
  }
  .btn:hover{background:rgba(128,128,128,0.12);}
  .btn.on{background:rgba(128,128,128,0.2);border-color:rgba(128,128,128,0.65);}
  .btn i{font-size:13px;}
  .btn:disabled{opacity:.3;cursor:default;}
  .btn:disabled:hover{background:transparent;}

  .lbl{font-size:11px;opacity:.5;white-space:nowrap;flex-shrink:0;}
  .swatch-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .swatch{
    width:16px;height:16px;
    border:1px solid rgba(128,128,128,0.35);border-radius:0;
    cursor:pointer;flex-shrink:0;
    outline:2px solid transparent;outline-offset:1px;transition:outline .1s;
  }
  .swatch.on{outline-color:rgba(128,128,128,.8);}
  .stat{display:inline-flex;align-items:center;gap:3px;font-size:11px;opacity:.55;white-space:nowrap;flex-shrink:0;}
  .stat i{font-size:12px;}
  .stat b{font-weight:500;}

  .tabs-bar{
    display:flex;flex-wrap:nowrap;align-items:stretch;
    border-bottom:1px solid rgba(128,128,128,0.2);
    overflow-x:auto;scrollbar-width:none;
    direction:rtl;
    transition:background .25s;
    min-height:34px;
  }
  .tabs-bar::-webkit-scrollbar{display:none;}
  .root.bg-def   .tabs-bar{background:var(--color-background-primary);}
  .root.bg-ivory .tabs-bar{background:#fdf6e3;}
  .root.bg-pink  .tabs-bar{background:#fdf0f0;}
  .root.bg-mint  .tabs-bar{background:#f0fdf5;}
  .root.bg-sky   .tabs-bar{background:#eff6ff;}
  .root.bg-gray  .tabs-bar{background:#f4f4f2;}
  .root.bg-night .tabs-bar{background:#1a1a2e;}
  .root.bg-dark  .tabs-bar{background:#212121;}

  .tab{
    display:inline-flex;align-items:center;gap:5px;
    padding:0 12px;
    font-size:12px;font-family:var(--font-sans);
    color:inherit;background:transparent;
    border:none;border-inline-end:1px solid rgba(128,128,128,0.15);
    cursor:pointer;white-space:nowrap;flex-shrink:0;
    opacity:.55;transition:background .12s,opacity .12s;
    height:34px;
  }
  .tab:last-of-type{border-inline-end:none;}
  .tab:hover{background:rgba(128,128,128,0.08);opacity:.8;}
  .tab.active{
    opacity:1;
    border-bottom:2px solid currentColor;
    background:rgba(128,128,128,0.06);
  }
  .tab.dragging{opacity:.3;}
  .tab.drag-over{background:rgba(128,128,128,0.15);}

  .tab-close{
    font-size:11px;opacity:.4;background:none;border:none;
    color:inherit;cursor:pointer;padding:0 2px;line-height:1;
  }
  .tab-close:hover{opacity:1;}

  .tab-add{
    display:inline-flex;align-items:center;justify-content:center;
    padding:0 12px;
    font-size:16px;color:inherit;background:transparent;border:none;
    cursor:pointer;opacity:.4;flex-shrink:0;height:34px;
    transition:opacity .12s;
  }
  .tab-add:hover{opacity:.8;}

  .body-wrap{padding:24px 20px;min-height:380px;}

  .paste-zone{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;min-height:300px;
    border:1px dashed rgba(128,128,128,0.3);
    cursor:pointer;transition:background .15s,border-color .15s;
    padding:32px;text-align:center;
  }
  .paste-zone:hover{background:rgba(128,128,128,0.05);border-color:rgba(128,128,128,.5);}
  .paste-zone.drag{background:rgba(128,128,128,.08);border-color:rgba(128,128,128,.7);}
  .paste-zone i{font-size:34px;opacity:.25;}
  .paste-title{font-size:15px;opacity:.5;}
  .paste-sub{font-size:11px;opacity:.3;}

  .modal-bg{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    align-items:center;justify-content:center;z-index:100;
  }
  .modal-bg.open{display:flex;}
  .modal{
    border:1px solid rgba(128,128,128,.3);border-radius:0;
    padding:20px;width:90%;max-width:540px;
    display:flex;flex-direction:column;gap:10px;
  }
  .modal-hdr{display:flex;align-items:center;gap:8px;}
  .modal-title{font-size:13px;font-weight:500;flex:1;}
  .modal-title-input{
    flex:1;font-family:var(--font-sans);font-size:13px;font-weight:500;
    background:transparent;border:none;border-bottom:1px solid rgba(128,128,128,.3);
    color:inherit;outline:none;padding:2px 0;
  }
  textarea.ta{
    width:100%;min-height:200px;padding:10px 12px;
    font-family:'Amiri',serif;font-size:17px;line-height:1.9;
    border:1px solid rgba(128,128,128,.3);border-radius:0;
    resize:vertical;outline:none;
    background:rgba(128,128,128,0.08);color:inherit;
  }
  textarea.ta:focus{border-color:rgba(128,128,128,.6);}
  textarea.ta::placeholder{opacity:.4;}
  .modal-btns{display:flex;gap:8px;}

  .chapter-text{
    font-family:'Amiri',serif;font-size:22px;line-height:2.2;
    max-width:850px;margin:0 auto;
    white-space:pre-wrap;word-break:break-word;color:inherit;
  }
  .chapter-text.fn {font-family:'Amiri',serif;}
  .chapter-text.fn2{font-family:'Noto Naskh Arabic',serif;}
  .chapter-text.fn3{font-family:var(--font-sans),serif;}
  .chapter-text.ar{text-align:right;}
  .chapter-text.ac{text-align:center;}
  .chapter-text.aj{text-align:justify;}

  .nav-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px 0;
  }
  .nav-info{font-size:11px;opacity:.4;}

  .orn{display:flex;flex-direction:column;align-items:center;margin:14px 0;}
  .orn-line{width:100%;max-width:400px;height:1px;background:currentColor;opacity:.15;}
  .orn-dot{width:6px;height:6px;border:1px solid currentColor;opacity:.22;transform:rotate(45deg);margin:4px auto;}

  .hidden{display:none!important;}

.progress-wrap{position:fixed;bottom:0;right:0;width:100%;height:3px;background:rgba(128,128,128,.08);z-index:999;}
.progress-bar{height:100%;width:0%;background:currentColor;opacity:.35;transition:width .1s;}
mark{background:rgba(255,255,0,.25);color:inherit;padding:0 2px;}
.focus-mode .sticky-bar,
.focus-mode .tabs-bar,
.focus-mode .nav-bar{
opacity:0;
transform:translateY(-10px);
pointer-events:none;
}
.sticky-bar,.tabs-bar,.nav-bar{transition:.2s;}






.tabs-bar{
transition:transform .22s ease, opacity .22s ease !important;
}

.tabs-bar.hide-tabs{
transform:translateY(-100%);
opacity:0;
pointer-events:none;
}


.bottom-nav{
display:flex;
justify-content:center;
gap:10px;
margin-top:30px;
padding-bottom:30px;
}


.context-menu{
position:fixed;
min-width:180px;
background:rgba(20,20,20,.96);
border:1px solid rgba(128,128,128,.22);
backdrop-filter:blur(10px);
display:none;
flex-direction:column;
padding:6px;
z-index:9999;
}

.context-menu.show{
display:flex;
}

.context-item{
display:flex;
align-items:center;
gap:8px;
padding:8px 10px;
font-size:12px;
cursor:pointer;
color:inherit;
background:transparent;
border:none;
text-align:right;
transition:.12s;
}

.context-item:hover{
background:rgba(128,128,128,.12);
}

.context-sep{
height:1px;
background:rgba(128,128,128,.12);
margin:4px 0;
}


.context-menu{
border-radius:10px;
box-shadow:0 10px 40px rgba(0,0,0,.35);
overflow:hidden;
}

.context-title{
padding:10px 12px;
font-size:11px;
opacity:.45;
border-bottom:1px solid rgba(128,128,128,.12);
}

.context-item{
justify-content:space-between;
border-radius:8px;
}

.context-item small{
opacity:.35;
font-size:10px;
}


.stats-box{
  display: flex;
  align-items: center;
  width: 190px;
  padding: 0;
  height: 28px;
  border: 1px solid rgba(128,128,128,0.35);
  flex-shrink: 0;
  overflow: hidden;
  white-space: nowrap;
}

.stats-divider{
  width: 1px;
  height: 100%;
  background: rgba(128,128,128, 0.35);
  flex-shrink: 0;
}

.stat{
  flex: 1;
  min-width: 0;
  padding: 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* التريكو لضمان ظهور النقاط الثلاث في نظام الفليكس */
.stats-box > *:last-child {
  flex-shrink: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.swatch{
width:28px!important;
height:28px!important;
}


.local-icon{
font-style:normal;
font-size:13px;
line-height:1;
display:inline-flex;
align-items:center;
justify-content:center;
min-width:14px;
}

.focus-exit{
position:fixed;
top:12px;
left:12px;
z-index:99999;
display:none;
padding:8px 14px;
background:rgba(0,0,0,.75);
color:#fff;
border:1px solid rgba(255,255,255,.15);
cursor:pointer;
backdrop-filter:blur(10px);
font-size:12px;
}

.focus-mode .focus-exit{
display:block;
}

.search-input{
  background:rgba(128,128,128,0.05);
  border:1px solid rgba(128,128,128,0.35);
  color:inherit;
  padding:0 10px;
  font-size:12px;
  height:28px;
  width:120px;
  outline:none;
  font-family:var(--font-sans);
}
.search-input:focus{
  border-color:rgba(128,128,128,0.65);
  background:rgba(128,128,128,0.1);
}

.main-layout{display:flex;}
.sidebar{
  width:240px;
  border-inline-end:1px solid rgba(128,128,128,0.15);
  padding:16px 12px;
  background:inherit;
  flex-shrink:0;
  overflow-y:auto;
  height:calc(100vh - 45px);
  position:fixed;
  top:45px;
  inset-inline-start:0;
  z-index:15;
  transition:background .25s;
}
.sidebar-title{
  font-size:13px;font-weight:bold;margin-bottom:12px;opacity:0.5;
  border-bottom:1px solid rgba(128,128,128,0.1);padding-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;
}
.side-list{display:flex;flex-direction:column;gap:2px;}
.side-item{
  display:block;width:100%;
  padding:8px 12px;font-size:13px;border:none;background:transparent;
  color:inherit;cursor:pointer;border-radius:0;
  transition:background 0.1s, color 0.1s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.side-item:hover{background:rgba(128,128,128,0.08);}
.side-item.active{
  background:rgba(128,128,128,0.12);
  font-weight:bold;
  border-inline-start:3px solid currentColor;
}

@media (max-width: 800px) {
  .sidebar { display: none; }
}

.site-name{
  font-family: 'Cinzel Decorative', serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 1px;
  margin-inline-end: 15px;
  white-space: nowrap;
  text-transform: uppercase;
}

</style>

  <div class="sticky-bar">
    <button class="btn" title="الرئيسية">الرئيسية</button>

</div>

<script src="storage.js"></script>
<script>

  
let continuousMode=false;

function toggleContinuousMode(){
  continuousMode=!continuousMode;
  const btn = document.getElementById('contBtn');
  if(btn) btn.classList.toggle('on', continuousMode);
  renderBody();
}


  let font='fn', sz=22, align='ar', activeIdx=0;
  let chapters=[];
  let dragSrcIdx=null;
  let sidebarVisible = true;

  const palettes=[
    {cls:'bg-def',  s:'#e8e6e0', bg:'var(--color-background-primary)', fg:'var(--color-text-primary)'},
    {cls:'bg-ivory',s:'#fdf6e3', bg:'#fdf6e3', fg:'#3b3020'},
    {cls:'bg-pink', s:'#fde8e8', bg:'#fdf0f0', fg:'#3a1e1e'},
    {cls:'bg-mint', s:'#d1fae5', bg:'#f0fdf5', fg:'#1a3326'},
    {cls:'bg-sky',  s:'#dbeafe', bg:'#eff6ff', fg:'#1e2f4a'},
    {cls:'bg-gray', s:'#e8e8e4', bg:'#f4f4f2', fg:'#2a2a2a'},
    {cls:'bg-night',s:'#1a1a2e', bg:'#1a1a2e', fg:'#e0d8c8'},
    {cls:'bg-dark', s:'#212121', bg:'#212121', fg:'#d4c9b0'},
  ];
  let activePalette=palettes[0];

function toggleSidebar(){
  sidebarVisible = !sidebarVisible;
  applySidebarState();
  save();
}

function applySidebarState(){
  const sb = document.getElementById('sidebar');
  const btn = document.getElementById('sideToggleBtn');
  if(sb){
    sb.classList.toggle('hidden', !sidebarVisible);
  }
  if(btn){
    btn.classList.toggle('on', sidebarVisible);
  }
}

window.addEventListener('beforeunload',save);

setInterval(save,2000);


function buildSwatches(){
    const c=document.getElementById('swatches');
    palettes.forEach((p,i)=>{
      const b=document.createElement('button');
      b.className='swatch'+(p.cls===activePalette.cls?' on':'');
      b.title=p.cls;
      b.style.background=p.s;
      b.onclick=()=>setBg(p,b);
      c.appendChild(b);
    });
  }

  function setBg(p,btn){
    activePalette=p;
    const r=document.getElementById('root');
    palettes.forEach(q=>r.classList.remove(q.cls));
    r.classList.add(p.cls);
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('on'));
    btn.classList.add('on');
    save();
  }

  function applyGlobalUI(){
    const r=document.getElementById('root');
    palettes.forEach(q=>r.classList.remove(q.cls));
    r.classList.add(activePalette.cls);
    document.getElementById('szlbl').textContent=sz;
    ['f1','f2','f3'].forEach(x=>document.getElementById(x).classList.remove('on'));
    const fi={fn:'f1',fn2:'f2',fn3:'f3'}[font];
    if(fi)document.getElementById(fi).classList.add('on');
    ['ar','ac','aj'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.classList.toggle('on',align===id);
    });

    const contBtn = document.getElementById('contBtn');
    if(contBtn) contBtn.classList.toggle('on', continuousMode);
    document.querySelectorAll('.swatch').forEach(s=>{
      s.classList.toggle('on', s.title===activePalette.cls);
    });
  }

  function setFont(f,id){font=f;['f1','f2','f3'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById(id).classList.add('on');renderBody();save();}
  function chSz(d){sz=Math.min(36,Math.max(14,sz+d));document.getElementById('szlbl').textContent=sz;renderBody();save();}
  function setAl(a,id){align=a;['ar','ac','aj'].forEach(x=>document.getElementById(x).classList.remove('on'));document.getElementById(id).classList.add('on');renderBody();save();}

  function stats(text){
    const w=text.trim()===''?0:text.trim().split(/\s+/).length;
    const ch=text.replace(/\s/g,'').length;
    const m=Math.max(1,Math.round(w/200));
    
    const shortNum = (n) => {
      if(n >= 1000) return (n/1000).toLocaleString('ar-EG', {maximumFractionDigits:1}) + ' <small style="font-size:0.8em; opacity:0.8;">ألف</small>';
      return n.toLocaleString('ar-EG');
    };

    document.getElementById('wc').innerHTML=shortNum(w);
    document.getElementById('cc').innerHTML=shortNum(ch);
    
    const rtEl = document.getElementById('rt');
    const rtLbl = document.getElementById('rt-lbl');
    
    if (m === 1) {
      rtEl.textContent = '';
      rtLbl.textContent = 'دقيقة واحدة';
    } else if (m === 2) {
      rtEl.textContent = '';
      rtLbl.textContent = 'دقيقتان';
    } else {
      rtEl.textContent = m.toLocaleString('ar-EG');
      rtLbl.textContent = (m >= 3 && m <= 10) ? 'دقائق' : 'دقيقة';
    }
  }

  function renderTabs(){
    const bar=document.getElementById('tabsBar');
    const side=document.getElementById('sideList');
    bar.innerHTML='';
    if(side) side.innerHTML='';

    chapters.forEach((ch,i)=>{
      // Top Tabs
      const t=document.createElement('button');
      t.className='tab'+(i===activeIdx?' active':'');
      t.textContent=ch.title||('فصل '+(i+1));
      t.draggable=true;
      t.onclick=()=>goTo(i);
      t.addEventListener('dragstart',e=>{dragSrcIdx=i;t.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
      t.addEventListener('dragend',()=>document.querySelectorAll('.tab').forEach(x=>x.classList.remove('dragging','drag-over')));
      t.addEventListener('dragover',e=>{e.preventDefault();t.classList.add('drag-over');});
      t.addEventListener('dragleave',()=>t.classList.remove('drag-over'));
      t.addEventListener('drop',e=>{
        e.preventDefault();t.classList.remove('drag-over');
        if(dragSrcIdx===null||dragSrcIdx===i)return;
        const moved=chapters.splice(dragSrcIdx,1)[0];
        chapters.splice(i,0,moved);
        activeIdx=i;
        dragSrcIdx=null;
        renderTabs();renderBody();save();
      });
      const cl=document.createElement('button');
      cl.className='tab-close';cl.textContent='×';cl.title='حذف';
      cl.onclick=(e)=>{e.stopPropagation();if(chapters.length===1){chapters[0].content='';chapters[0].title='فصل 1';}else{chapters.splice(i,1);if(activeIdx>=chapters.length)activeIdx=chapters.length-1;}renderTabs();renderBody();save();};
      t.appendChild(cl);
      bar.appendChild(t);

      // Sidebar Item
      if(side){
        const s = document.createElement('button');
        s.className = 'side-item' + (i===activeIdx?' active':'');
        s.textContent = ch.title || ('فصل ' + (i+1));
        s.onclick = () => goTo(i);
        side.appendChild(s);
      }
    });

    const add=document.createElement('button');
    add.className='tab-add';add.textContent='+';add.title='فصل جديد';
    add.onclick=addChapter;
    bar.appendChild(add);
  }

  function renderBody(){
    const wrap=document.getElementById('bodyWrap');
    const ch=chapters[activeIdx];
    if(!ch){wrap.innerHTML='';return;}
    if(!ch.content){
      wrap.innerHTML=`<div class="paste-zone" id="pasteZone" role="button">
        <i class="ti ti-clipboard-text" aria-hidden="true"></i>
        <div class="paste-title">انقر للصق نص الفصل</div>
        <div class="paste-sub">أو اسحب النص وأفلته هنا</div>
      </div>`;
      document.getElementById('pasteZone').onclick=openModal;
      const z=document.getElementById('pasteZone');
      z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('drag');});
      z.addEventListener('dragleave',()=>z.classList.remove('drag'));
      z.addEventListener('drop',e=>{
        e.preventDefault();z.classList.remove('drag');
        const text=e.dataTransfer.getData('text');
        if(text){document.getElementById('ta').value=text;applyText();}
      });
      stats('');
    } else {
      
if(continuousMode){

let full='';

chapters.forEach((c,i)=>{

if(!c.content)return;

        full+=`
        <h2 id="ch-title-${i}" class="chapter-text ch-marker ${font} ${align}" data-index="${i}" style="font-size:${sz}px; font-weight:bold; margin-top:2rem; margin-bottom:16px;">${escHtml(c.title)}</h2>
        <div class="chapter-text ${font} ${align}" style="font-size:${sz}px;">
        ${escHtml(c.content)}
        </div>
        <div class="orn" style="margin-top:3rem; margin-bottom:3rem;"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line"></div></div>
        `;
      });
      wrap.innerHTML=full;
      stats(chapters[activeIdx].content);
    } else {
      wrap.innerHTML=`
      ${activeIdx!==0?'<div class="orn"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line"></div></div>':''}
      <h2 id="ch-title-${activeIdx}" class="chapter-text ch-marker ${font} ${align}" data-index="${activeIdx}" style="font-size:${sz}px; font-weight:bold; margin-bottom:16px;">${escHtml(ch.title)}</h2>
      <div class="chapter-text ${font} ${align}" id="chapterText" style="font-size:${sz}px;">${escHtml(ch.content)}</div>
      <div class="orn" style="margin-top:2rem;"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line"></div></div>`;
      stats(ch.content);
    }

    }
    const prev=document.getElementById('prevBtn');
    const next=document.getElementById('nextBtn');
    const info=document.getElementById('navInfo');
    if(prev) prev.disabled=activeIdx===0;
    if(next) next.disabled=activeIdx===chapters.length-1;
    if(info) info.textContent=(activeIdx+1)+' / '+chapters.length;
  }

  function escHtml(t){
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addChapter(){
    chapters.push({title:'فصل '+(chapters.length+1),content:''});
    activeIdx=chapters.length-1;
    renderTabs();renderBody();save();
  }

  function goTo(i){
    if(i<0||i>=chapters.length)return;
    const oldIdx = activeIdx;
    activeIdx=i;
    
    if(continuousMode){
      const target = document.getElementById(`ch-title-${i}`);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'start'});
        updateActiveUI();
      } else {
        renderTabs();renderBody();
      }
    } else {
      renderTabs();renderBody();
    }
    save();
  }

  function updateActiveUI(){
    // Update tabs
    document.querySelectorAll('.tab').forEach((t, idx) => {
      t.classList.toggle('active', idx === activeIdx);
    });
    // Update sidebar
    document.querySelectorAll('.side-item').forEach((s, idx) => {
      s.classList.toggle('active', idx === activeIdx);
    });
    // Update nav info if exists
    const info=document.getElementById('navInfo');
    if(info) info.textContent=(activeIdx+1)+' / '+chapters.length;
  }

  function deleteChapter(){
    if(chapters.length===1){chapters[0].content='';chapters[0].title='فصل 1';}
    else{chapters.splice(activeIdx,1);if(activeIdx>=chapters.length)activeIdx=chapters.length-1;}
    renderTabs();renderBody();save();
  }

  function syncModal(){
    const m=document.getElementById('modal');
    m.style.background=activePalette.bg;
    m.style.color=activePalette.fg;
    const els=m.querySelectorAll('.ta,.btn,.modal-title,.modal-title-input');
    els.forEach(el=>{el.style.color=activePalette.fg;});
    document.getElementById('ta').style.background='rgba(128,128,128,0.08)';
    document.getElementById('titleInput').style.borderBottomColor='rgba(128,128,128,.3)';
  }

  function openModal(){
    const ch=chapters[activeIdx];
    document.getElementById('titleInput').value=ch?ch.title:'';
    document.getElementById('ta').value=ch?ch.content:'';
    document.getElementById('modalBg').classList.add('open');
    syncModal();
    setTimeout(()=>document.getElementById('ta').focus(),80);
  }

  
function closeModal(){

document.getElementById('modalBg')
.classList.remove('open');

}


  function applyText(){
    try {
      const text=document.getElementById('ta').value.trim();
      const title=document.getElementById('titleInput').value.trim();
      if(!chapters[activeIdx])return;
      chapters[activeIdx].content=text;
      if(title)chapters[activeIdx].title=title;
      renderTabs();
      renderBody();
      save();
    } catch(e) {
      console.error('applyText error', e);
    } finally {
      closeModal();
    }
  }

  document.getElementById('modalBg').addEventListener('click',e=>{
    if(e.target===document.getElementById('modalBg'))closeModal();
  });

  
document.getElementById('ta')
.addEventListener('input',()=>{

if(!chapters[activeIdx])return;

chapters[activeIdx].content=
document.getElementById('ta').value;

save();

});

document.getElementById('titleInput')
.addEventListener('input',()=>{

if(!chapters[activeIdx])return;

chapters[activeIdx].title=
document.getElementById('titleInput').value;

renderTabs();

save();

});


load();
  if(chapters.length===0)chapters=[{title:'فصل 1',content:''}];
  if(activeIdx>=chapters.length)activeIdx=0;
  buildSwatches();
  applyGlobalUI();
  applySidebarState();
  renderTabs();
  renderBody();

function doSearch(q){
  const el=document.getElementById('chapterText');
  if(!el)return;
  const txt=chapters[activeIdx].content;
  if(!txt)return;
  if(!q){
    el.innerHTML=escHtml(txt);
    return;
  }
  try {
    const rg=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),'gi');
    el.innerHTML=escHtml(txt).replace(rg,m=>`<mark>${m}</mark>`);
  } catch(e) {}
}

function searchInChapter(){
  // This function is kept for context menu or shortcuts if needed, 
  // but now redirects to focusing the input.
  const input = document.getElementById('sq');
  if(input) input.focus();
}

function exportTxt(){

const ch=chapters[activeIdx];

const blob=new Blob(
[ch.content],
{type:'text/plain;charset=utf-8'}
);

const a=document.createElement('a');

a.href=URL.createObjectURL(blob);

a.download=(ch.title||'chapter')+'.txt';

a.click();

}


function toggleFocus(){

document.body.classList.toggle('focus-mode');

}


let lastScrollY=window.scrollY;
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  const p=(window.scrollY/h)*100;
  const bar=document.getElementById('progressBar');
  if(bar) bar.style.width=(isFinite(p)?p:0)+'%';

  // Hide tabs on scroll
  const tabs=document.getElementById('tabsBar');
  const current=window.scrollY;
  if(tabs){
    if(current>lastScrollY && current>80) tabs.classList.add('hide-tabs');
    else tabs.classList.remove('hide-tabs');
  }
  lastScrollY=current;

  // Improved Chapter Sync (Detects both directions)
  if(continuousMode){
    const markers = document.querySelectorAll('.ch-marker');
    let currentIdx = activeIdx;
    for(let m of markers){
      const rect = m.getBoundingClientRect();
      if(rect.top <= 120){
        currentIdx = parseInt(m.getAttribute('data-index'));
      } else {
        break; // Titles below this are definitely not active yet
      }
    }
    if(!isNaN(currentIdx) && activeIdx !== currentIdx){
      activeIdx = currentIdx;
      updateActiveUI();
      stats(chapters[activeIdx].content);
    }
  }
});

window.addEventListener('keydown',e=>{

if(e.ctrlKey && e.key==='ArrowLeft'){
goTo(activeIdx+1);
}

if(e.ctrlKey && e.key==='ArrowRight'){
goTo(activeIdx-1);
}

if(e.ctrlKey && e.key==='f'){
e.preventDefault();
searchInChapter();
}

});


const contextMenu=document.getElementById('contextMenu');

document.addEventListener('contextmenu',e=>{

e.preventDefault();

contextMenu.style.left=e.clientX+'px';
contextMenu.style.top=e.clientY+'px';

contextMenu.classList.add('show');

syncContextTheme();

});

document.addEventListener('click',()=>{
contextMenu.classList.remove('show');
});

function syncContextTheme(){

const bg=getComputedStyle(
document.getElementById('root')
).backgroundColor;

const fg=getComputedStyle(
document.getElementById('root')
).color;

contextMenu.style.background=bg;
contextMenu.style.color=fg;

}

function setThemeQuick(cls){

const palette=palettes.find(p=>p.cls===cls);

if(!palette)return;

activePalette=palette;

const r=document.getElementById('root');

palettes.forEach(q=>r.classList.remove(q.cls));

r.classList.add(palette.cls);

document.querySelectorAll('.swatch')
.forEach(s=>{

s.classList.toggle(
'on',
s.title===palette.cls
);

});

save();

}


window.addEventListener('keydown',e=>{
  if(e.key==='Escape' && document.body.classList.contains('focus-mode')){
    document.body.classList.remove('focus-mode');
  }
});

</script>
